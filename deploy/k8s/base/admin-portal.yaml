apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  labels:
    app.kubernetes.io/name: admin-portal
    app.kubernetes.io/part-of: device-management-platform
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-portal
        app.kubernetes.io/part-of: device-management-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-portal
          image: ghcr.io/owner/repo/admin-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  labels:
    app.kubernetes.io/name: admin-portal
    app.kubernetes.io/part-of: device-management-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-portal
  ports:
    - name: http
      port: 80
      targetPort: http
