apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-api
  labels:
    app.kubernetes.io/name: device-api
    app.kubernetes.io/part-of: device-management-platform
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: device-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: device-api
        app.kubernetes.io/part-of: device-management-platform
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-api
          image: ghcr.io/owner/repo/device-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: device-api
  labels:
    app.kubernetes.io/name: device-api
    app.kubernetes.io/part-of: device-management-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: device-api
  ports:
    - name: http
      port: 80
      targetPort: http
