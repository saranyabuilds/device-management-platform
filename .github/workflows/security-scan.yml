name: Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Dependencies and Containers
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level critical

      - name: Maven dependency audit
        working-directory: services/device-api
        run: ./mvnw -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build admin portal scan image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-portal/Dockerfile
          load: true
          tags: admin-portal:security-scan
          cache-from: type=gha,scope=admin-portal
          cache-to: type=gha,mode=max,scope=admin-portal

      - name: Build device API scan image
        uses: docker/build-push-action@v6
        with:
          context: services/device-api
          load: true
          tags: device-api:security-scan
          cache-from: type=gha,scope=device-api
          cache-to: type=gha,mode=max,scope=device-api

      - name: Trivy filesystem scan
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL
          exit-code: '1'

      - name: Upload filesystem SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy admin portal image scan
        id: trivy-admin-portal
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: admin-portal:security-scan
          format: sarif
          output: trivy-admin-portal.sarif
          severity: CRITICAL
          exit-code: '1'

      - name: Upload admin portal SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-admin-portal.sarif
          category: trivy-admin-portal

      - name: Trivy device API image scan
        id: trivy-device-api
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: device-api:security-scan
          format: sarif
          output: trivy-device-api.sarif
          severity: CRITICAL
          exit-code: '1'

      - name: Upload device API SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-device-api.sarif
          category: trivy-device-api

      - name: Fail on critical Trivy findings
        if: >-
          steps.trivy-fs.outcome == 'failure' ||
          steps.trivy-admin-portal.outcome == 'failure' ||
          steps.trivy-device-api.outcome == 'failure'
        run: exit 1
