name: Build and Publish Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          branch="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::12}"
          echo "admin_image=${REGISTRY}/${repo}/admin-portal" >> "${GITHUB_OUTPUT}"
          echo "device_image=${REGISTRY}/${repo}/device-api" >> "${GITHUB_OUTPUT}"
          echo "branch_tag=ref-${branch}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=sha-${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN || github.token }}

      - name: Build and publish admin portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-portal/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.admin_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.admin_image }}:${{ steps.meta.outputs.branch_tag }}
            ${{ steps.meta.outputs.admin_image }}:latest
          cache-from: type=gha,scope=admin-portal
          cache-to: type=gha,mode=max,scope=admin-portal

      - name: Build and publish device API
        uses: docker/build-push-action@v6
        with:
          context: services/device-api
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.device_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.device_image }}:${{ steps.meta.outputs.branch_tag }}
            ${{ steps.meta.outputs.device_image }}:latest
          cache-from: type=gha,scope=device-api
          cache-to: type=gha,mode=max,scope=device-api

      - name: Summary
        run: |
          echo "Published images:" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ${{ steps.meta.outputs.admin_image }}:${{ steps.meta.outputs.sha_tag }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ${{ steps.meta.outputs.device_image }}:${{ steps.meta.outputs.sha_tag }}" >> "${GITHUB_STEP_SUMMARY}"
