global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: device-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - device-api:8080
        labels:
          service: device-api

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
        labels:
          service: kafka

  - job_name: mqtt
    static_configs:
      - targets:
          - mqtt-exporter:9234
        labels:
          service: mqtt
