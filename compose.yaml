name: device-management-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: dmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-device_management}
      POSTGRES_USER: ${POSTGRES_USER:-dmp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmp_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - dmp-local

  redis:
    image: redis:7-alpine
    container_name: dmp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dmp-local

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dmp-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_NODE_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - '${KAFKA_PORT:-9094}:9094'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - dmp-local

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: dmp-mqtt
    restart: unless-stopped
    ports:
      - '${MQTT_PORT:-1883}:1883'
      - '${MQTT_WEBSOCKET_PORT:-9001}:9001'
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    healthcheck:
      test:
        ['CMD-SHELL', 'mosquitto_pub -h localhost -p 1883 -t dmp/healthcheck -m ok >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dmp-local

  loki:
    image: grafana/loki:3.2.1
    container_name: dmp-loki
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - dmp-local

  promtail:
    image: grafana/promtail:3.2.1
    container_name: dmp-promtail
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/promtail-config.yml']
    volumes:
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - dmp-local

  grafana:
    image: grafana/grafana:11.2.2
    container_name: dmp-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
      - jaeger
    networks:
      - dmp-local

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: dmp-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '${JAEGER_UI_PORT:-16686}:16686'
      - '${OTEL_GRPC_PORT:-4317}:4317'
      - '${OTEL_HTTP_PORT:-4318}:4318'
    networks:
      - dmp-local

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: dmp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - dmp-local

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: dmp-kafka-exporter
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=:9308
    ports:
      - '${KAFKA_EXPORTER_PORT:-9308}:9308'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - dmp-local

  mqtt-exporter:
    image: sapcc/mosquitto-exporter:0.8.0
    container_name: dmp-mqtt-exporter
    restart: unless-stopped
    environment:
      BROKER_ENDPOINT: tcp://mqtt:1883
    ports:
      - '${MQTT_EXPORTER_PORT:-9234}:9234'
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - dmp-local

  device-api:
    profiles: ['apps']
    build:
      context: services/device-api
    image: device-api:local
    container_name: dmp-device-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${DEVICE_API_PROFILE:-local}
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-device_management}
      POSTGRES_USER: ${POSTGRES_USER:-dmp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmp_password}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_BROKER_URL: tcp://mqtt:1883
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-device-api}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-tracecontext,baggage}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}
    ports:
      - '${DEVICE_API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - dmp-local

  admin-portal:
    profiles: ['apps']
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    image: admin-portal:local
    container_name: dmp-admin-portal
    restart: unless-stopped
    ports:
      - '${ADMIN_PORTAL_PORT:-4200}:8080'
    depends_on:
      device-api:
        condition: service_started
    networks:
      - dmp-local

networks:
  dmp-local:
    name: dmp-local
    driver: bridge

volumes:
  postgres_data:
    name: dmp-postgres-data
  redis_data:
    name: dmp-redis-data
  kafka_data:
    name: dmp-kafka-data
  mqtt_data:
    name: dmp-mqtt-data
  mqtt_log:
    name: dmp-mqtt-log
  loki_data:
    name: dmp-loki-data
  grafana_data:
    name: dmp-grafana-data
  prometheus_data:
    name: dmp-prometheus-data
