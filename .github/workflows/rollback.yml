name: Rollback Kubernetes Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      service:
        description: Service to roll back
        required: true
        type: choice
        options:
          - all
          - admin-portal
          - device-api
      image_tag:
        description: Optional image tag. Leave blank to use kubectl rollout undo.
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}

jobs:
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Kubernetes credentials
        id: kube
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          KUBE_CONFIG_DEV: ${{ secrets.KUBE_CONFIG_DEV }}
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
          KUBE_CONFIG_PROD: ${{ secrets.KUBE_CONFIG_PROD }}
          KUBE_NAMESPACE_DEV: ${{ secrets.KUBE_NAMESPACE_DEV }}
          KUBE_NAMESPACE_STAGING: ${{ secrets.KUBE_NAMESPACE_STAGING }}
          KUBE_NAMESPACE_PROD: ${{ secrets.KUBE_NAMESPACE_PROD }}
        run: |
          case "${TARGET_ENV}" in
            dev)
              kube_config="${KUBE_CONFIG_DEV}"
              namespace="${KUBE_NAMESPACE_DEV}"
              ;;
            staging)
              kube_config="${KUBE_CONFIG_STAGING}"
              namespace="${KUBE_NAMESPACE_STAGING}"
              ;;
            prod)
              kube_config="${KUBE_CONFIG_PROD}"
              namespace="${KUBE_NAMESPACE_PROD}"
              ;;
            *)
              echo "Unsupported environment: ${TARGET_ENV}" >&2
              exit 1
              ;;
          esac

          if [ -z "${kube_config}" ] || [ -z "${namespace}" ]; then
            echo "Missing Kubernetes secret configuration for ${TARGET_ENV}" >&2
            exit 1
          fi

          write_kubeconfig() {
            if printf '%s' "${kube_config}" | base64 -d > "${HOME}/.kube/config" 2>/dev/null; then
              return
            fi

            printf '%s' "${kube_config}" > "${HOME}/.kube/config"
          }

          mkdir -p "${HOME}/.kube"
          write_kubeconfig
          chmod 600 "${HOME}/.kube/config"
          echo "namespace=${namespace}" >> "${GITHUB_OUTPUT}"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Login to container registry
        if: inputs.image_tag != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN || github.token }}

      - name: Verify rollback image tags exist
        if: inputs.image_tag != ''
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! [[ "${IMAGE_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image tag: ${IMAGE_TAG}" >&2
            exit 1
          fi

          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          verify_image() {
            docker manifest inspect "${REGISTRY}/${repo}/$1:${IMAGE_TAG}" >/dev/null
          }

          case "${SERVICE}" in
            all)
              verify_image admin-portal
              verify_image device-api
              ;;
            admin-portal|device-api)
              verify_image "${SERVICE}"
              ;;
            *)
              echo "Unsupported service: ${SERVICE}" >&2
              exit 1
              ;;
          esac

      - name: Rollback deployments
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET_ENV: ${{ inputs.environment }}
          NAMESPACE: ${{ steps.kube.outputs.namespace }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repo="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          rollback_service() {
            service="$1"
            deployment="${service}-${TARGET_ENV}"

            if [ -n "${IMAGE_TAG}" ]; then
              image="${REGISTRY}/${repo}/${service}:${IMAGE_TAG}"
              kubectl -n "${NAMESPACE}" set image "deployment/${deployment}" "${service}=${image}"
            else
              kubectl -n "${NAMESPACE}" rollout undo "deployment/${deployment}"
            fi

            kubectl -n "${NAMESPACE}" rollout status "deployment/${deployment}" --timeout=180s
          }

          case "${SERVICE}" in
            all)
              rollback_service admin-portal
              rollback_service device-api
              ;;
            admin-portal|device-api)
              rollback_service "${SERVICE}"
              ;;
            *)
              echo "Unsupported service: ${SERVICE}" >&2
              exit 1
              ;;
          esac

      - name: Verify rollback
        run: |
          kubectl -n "${{ steps.kube.outputs.namespace }}" get deploy,rs,pods -l app.kubernetes.io/part-of=device-management-platform
