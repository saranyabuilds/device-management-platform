name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        env:
          CI: 'true'
        run: pnpm build

      - name: Maven test device-api
        working-directory: services/device-api
        run: ./mvnw test

      - name: Maven package device-api
        working-directory: services/device-api
        run: ./mvnw -B clean package

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build admin portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-portal/Dockerfile
          push: false
          tags: admin-portal:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=admin-portal
          cache-to: type=gha,mode=max,scope=admin-portal

      - name: Build device API image
        uses: docker/build-push-action@v6
        with:
          context: services/device-api
          push: false
          tags: device-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=device-api
          cache-to: type=gha,mode=max,scope=device-api
